# Fly.io config for Vault Cortex — used by the flyctl recipe in README.md.
# `fly launch --copy-config` fills in `app` and `primary_region`; this file
# deliberately ships without them.

[build]
  # Published image: no Dockerfile build happens, even if one is nearby.
  image = "ghcr.io/aliasunder/vault-cortex:remote"

[env]
  # Already the image default; kept so every hosted template carries the
  # same keys.
  PORT = "8000"
  # Must equal [[mounts]] destination: the vault, search index, Sync device
  # state, and logs all live under this one volume.
  STORAGE_ROOT = "/persist"
  # Name shown in Obsidian Sync's device list. Without it the device is
  # registered under the machine's random hostname.
  DEVICE_NAME = "vault-cortex"
  # Fly's proxy appends the app's own address after the client's: two hops.
  TRUST_PROXY_HOPS = "2"
  # Set as secrets, not here (README step 3):
  #   MCP_AUTH_TOKEN, OBSIDIAN_AUTH_TOKEN, VAULT_NAME,
  #   VAULT_PASSWORD (end-to-end-encrypted vaults only)

[[mounts]]
  # Created by `fly volumes create` in the recipe.
  source = "vault_cortex_storage"
  destination = "/persist"
  initial_size = "5gb"

[http_service]
  internal_port = 8000
  force_https = true
  # One always-on machine: Obsidian Sync must keep running to stay current.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    # The server answers after the first Obsidian Sync and the search-index
    # build finish; a large vault's first boot can take longer than this
    # (see README Troubleshooting).
    grace_period = "300s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  # 2 GB is the floor for semantic search; shared-cpu-1x tops out at 2 GB.
  size = "shared-cpu-1x"
  memory = "2gb"
