# Local development — run vault-cortex against ~/Vault without Lightsail.
# obsidian-sync is not needed locally (your Mac already has the vault).
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
#   npm run dev:docker  (same thing)

name: vault-cortex-local

services:
  vault-cortex:
    # target pinned explicitly — the local stage is also the Dockerfile
    # default, but repo tooling doesn't rely on stage ordering.
    build:
      context: .
      target: local
    container_name: vault-cortex-local
    environment:
      NODE_ENV: development
      PORT: "8000"
      HOST: "0.0.0.0"
      VAULT_PATH: /vault
      INDEX_DB_PATH: /data/index.db
      MCP_AUTH_TOKEN: local-dev-token
      PUBLIC_URL: http://localhost:8000
      # Client-IP trust for rate limiting (see .env.example): the defaults
      # are safe with nothing in front of the server; set TRUST_PROXY_HOPS=1
      # when a proxy or tunnel sits in front.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      TRUST_FORWARDED_HEADER: ${TRUST_FORWARDED_HEADER:-false}
      LOG_LEVEL: debug
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      RERANK_MODE: ${RERANK_MODE:-blended}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      FILE_TOOLS_ENABLED: ${FILE_TOOLS_ENABLED:-true}
      # Note: the vault mount below is :ro, so write tool calls fail at the
      # filesystem — change the mount to :rw to exercise writes for real.
      READONLY_MODE: ${READONLY_MODE:-false}
      DISABLED_TOOLS: ${DISABLED_TOOLS:-}
      MEMORY_DIR: ${MEMORY_DIR:-About Me}
      TZ: ${TZ:-UTC}
      # Windows: set WINDOWS_MODE=true when developing against a vault on a C: drive
      # (polling watcher + rename-based moves across the Docker Desktop/WSL2 bridge).
      WINDOWS_MODE: ${WINDOWS_MODE:-false}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-52428800}
      MAX_IMAGE_OUTPUT_BYTES: ${MAX_IMAGE_OUTPUT_BYTES:-49152}
      MAX_PDF_RENDER_PAGES: ${MAX_PDF_RENDER_PAGES:-5}
      MAX_OAUTH_CLIENTS: ${MAX_OAUTH_CLIENTS:-1000}
      # Left empty = the server applies smart defaults
      # (<MEMORY_DIR>/<DAILY_NOTES_FOLDER> below are the resolved values, defaults "About Me" / "Daily Notes"):
      #   PROTECTED_PATHS           default: "<MEMORY_DIR>, <DAILY_NOTES_FOLDER>"
      #   ORPHAN_EXCLUDE_FOLDERS    default: "<DAILY_NOTES_FOLDER>, Templates, <MEMORY_DIR>"
      #   SERVICE_DOCUMENTATION_URL default: https://github.com/aliasunder/vault-cortex
      #   DAILY_NOTES_FOLDER        default: read from the vault's .obsidian/daily-notes.json, else "Daily Notes"
      #   DAILY_NOTES_FORMAT        default: read from the vault's .obsidian/daily-notes.json, else "YYYY-MM-DD"
      PROTECTED_PATHS: ${PROTECTED_PATHS:-}
      ORPHAN_EXCLUDE_FOLDERS: ${ORPHAN_EXCLUDE_FOLDERS:-}
      SERVICE_DOCUMENTATION_URL: ${SERVICE_DOCUMENTATION_URL:-}
      DAILY_NOTES_FOLDER: ${DAILY_NOTES_FOLDER:-}
      DAILY_NOTES_FORMAT: ${DAILY_NOTES_FORMAT:-}
    volumes:
      - ~/Vault:/vault:ro
      - mcp_local_data:/data
    ports:
      - "8000:8000"

volumes:
  mcp_local_data:
