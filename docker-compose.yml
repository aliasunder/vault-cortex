# Runs on the Lightsail instance at /opt/vault-cortex/docker-compose.yml
#
# Single service: the vault-cortex :remote image bundles obsidian-sync and
# the MCP server under s6-overlay supervision — sync keeps /vault current
# (bidirectional Obsidian Sync) and the MCP server listens on :8000.
# Compose remains here as an operational wrapper (declarative restart
# policy, --wait healthcheck gating, log rotation), not a user requirement.
#
# API Gateway handles TLS + auth upstream. vault-cortex ALSO validates
# the bearer token in-process (Express middleware) as defense in
# depth — see src/vault-mcp/server.ts. Port 8000 is publicly bound
# but unauthenticated requests are rejected at the application layer.

name: vault-cortex

services:
  vault-cortex:
    image: ghcr.io/${GHCR_USER:?GHCR_USER required}/vault-cortex:${VAULT_CORTEX_TAG:-remote}
    container_name: vault-cortex
    hostname: ${DEVICE_NAME:-vault-cortex}
    restart: unless-stopped
    environment:
      # --- Obsidian Sync (s6 init chain + svc-obsidian-sync) ---
      OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN}
      VAULT_NAME: "${VAULT_NAME:?Set VAULT_NAME to your Obsidian vault name (case-sensitive)}"
      VAULT_PASSWORD: ${VAULT_PASSWORD:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DEVICE_NAME: ${DEVICE_NAME:-vault-cortex-lightsail}
      CONFLICT_STRATEGY: ${CONFLICT_STRATEGY:-merge}
      SYNC_MODE: ${SYNC_MODE:-bidirectional}
      SYNC_EXCLUDED_FOLDERS: ${SYNC_EXCLUDED_FOLDERS:-}
      SYNC_FILE_TYPES: ${SYNC_FILE_TYPES:-}
      # Obsidian config-category sync (default: core plugin data, so the
      # vault's daily-notes settings reach the server). "none" disables;
      # the category values are listed in .env.example.
      SYNC_CONFIGS: ${SYNC_CONFIGS:-core-plugin-data,community-plugin-data}
      # --- MCP server (svc-vault-mcp) ---
      NODE_ENV: production
      PORT: "8000"
      HOST: "0.0.0.0"
      VAULT_PATH: /vault
      INDEX_DB_PATH: /data/index.db
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN required for in-process auth}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL required for OAuth metadata}
      # API Gateway is the immediate upstream: its RFC 7239 Forwarded claim is
      # the client identity for rate limiting. Traffic that reaches this port
      # directly (bypassing the gateway) can claim any Forwarded identity —
      # see DEPLOY.md "Port 8000 Hardening" before relying on these defaults.
      # With ORIGIN_URL (a tunnel/proxy BETWEEN the gateway and this container)
      # keep TRUST_FORWARDED_HEADER=true and set TRUST_PROXY_HOPS=2. The
      # gateway sends no X-Forwarded-For, so the Forwarded header is the only
      # carrier of the client IP. With a CDN in front of the gateway's custom
      # domain, also set TRUST_FORWARDED_HOPS=2.
      TRUST_FORWARDED_HEADER: ${TRUST_FORWARDED_HEADER:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TRUST_FORWARDED_HOPS: ${TRUST_FORWARDED_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/data/logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      TZ: ${TZ:-UTC}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      RERANK_MODE: ${RERANK_MODE:-blended}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      FILE_TOOLS_ENABLED: ${FILE_TOOLS_ENABLED:-true}
      READONLY_MODE: ${READONLY_MODE:-false}
      DISABLED_TOOLS: ${DISABLED_TOOLS:-}
      WINDOWS_MODE: ${WINDOWS_MODE:-false}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-52428800}
      MAX_IMAGE_OUTPUT_BYTES: ${MAX_IMAGE_OUTPUT_BYTES:-49152}
      MAX_PDF_RENDER_PAGES: ${MAX_PDF_RENDER_PAGES:-5}
      MEMORY_DIR: ${MEMORY_DIR:-About Me}
      # Left empty = the server applies smart defaults
      # (<MEMORY_DIR>/<DAILY_NOTES_FOLDER> below are the resolved values, defaults "About Me" / "Daily Notes"):
      #   PROTECTED_PATHS           default: "<MEMORY_DIR>, <DAILY_NOTES_FOLDER>"
      #   ORPHAN_EXCLUDE_FOLDERS    default: "<DAILY_NOTES_FOLDER>, Templates, <MEMORY_DIR>"
      #   SERVICE_DOCUMENTATION_URL default: https://github.com/aliasunder/vault-cortex
      #   DAILY_NOTES_FOLDER        default: read from the vault's .obsidian/daily-notes.json, else "Daily Notes"
      #   DAILY_NOTES_FORMAT        default: read from the vault's .obsidian/daily-notes.json, else "YYYY-MM-DD"
      PROTECTED_PATHS: ${PROTECTED_PATHS:-}
      ORPHAN_EXCLUDE_FOLDERS: ${ORPHAN_EXCLUDE_FOLDERS:-}
      SERVICE_DOCUMENTATION_URL: ${SERVICE_DOCUMENTATION_URL:-}
      DAILY_NOTES_FOLDER: ${DAILY_NOTES_FOLDER:-}
      DAILY_NOTES_FORMAT: ${DAILY_NOTES_FORMAT:-}
    volumes:
      - vault_data:/vault
      - mcp_index_data:/data
      - obsidian_config:/home/obsidian/.config
    ports:
      - "0.0.0.0:8000:8000"
    # start_period covers the s6 init chain (Obsidian login + sync-setup +
    # first vault sync, run to completion when it succeeds) that runs before
    # the MCP server boots.
    # Failures during start_period don't count against retries; a fast boot
    # flips healthy immediately.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Explicit names pin these to the volumes that already exist on the
  # host — a rename (or project-name drift) silently creates fresh empty
  # volumes, detaching the synced vault, search index, and Obsidian
  # login state.
  vault_data: { name: vault-cortex_vault_data }
  mcp_index_data: { name: vault-cortex_mcp_index_data }
  obsidian_config: { name: vault-cortex_obsidian_config }
