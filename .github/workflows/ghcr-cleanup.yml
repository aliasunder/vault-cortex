name: GHCR Cleanup

on:
  schedule:
    # Weekly on Sunday at 03:00 UTC — after any weekend releases settle.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be deleted without actually deleting"
        required: false
        default: true
        type: boolean

# Top-level token is read-only; the job declares its writes.
permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged GHCR images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: vault-cortex
          owner: ${{ vars.GHCR_USER }}
          delete-untagged: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
