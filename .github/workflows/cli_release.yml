name: Release CLI

# Publishes the cli/ package to npm. CLI releases are explicit and
# independent of server releases — run this workflow when a merged cli/
# change should ship. "none" publishes the current cli/package.json
# version without bumping (used for the first publish). "beta" publishes
# a prerelease under the `beta` dist-tag for testing from any branch —
# no commit, no tag, no GitHub release. Test with: npx vault-cortex@beta
#
# Safe to dispatch again after a failed publish: a version that is tagged but
# absent from npm is detected as a failed earlier release. Bump "none"
# publishes it as-is; any other bump fails with instructions instead of
# silently skipping the stranded version or overriding the request.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type ("none" publishes the current cli/package.json version)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - beta
          - none

# Shares the server release/deploy group: both release flows push to
# main, so running them at once can reject one push. A run dispatched
# while a server release is in flight queues until it's done.
# GitHub keeps one queued run per group, so any later run in the group (a
# release or deploy dispatch, or a v* tag push) cancels the queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Top-level token is read-only; the job declares its writes.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create (git pushes use the App token)
      id-token: write # npm provenance
    steps:
      # Only a beta publishes from other branches. A versioned release
      # dispatched on another branch would publish that branch's code and
      # push its bump commit there, while main's version stays behind. The
      # ref is compared in the shell: an if: expression ignores case, so it
      # would let a branch named Main through.
      - name: Require main for a versioned release
        if: inputs.bump != 'beta'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release CLI runs on main except for a beta; this run was dispatched on $GITHUB_REF."
            exit 1
          fi

      - name: Generate App token
        if: inputs.bump != 'beta'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # No App token here: npm ci below runs dependency lifecycle scripts,
      # which must not find a repo-write credential in .git/config. The App
      # token is supplied only to the push step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the cli-v* tag lookups and the commit check
          # below need it.
          fetch-depth: 0
          persist-credentials: false
          # - First attempt of a versioned release: the branch's latest commit,
          #   so a run queued behind a server release builds on that release's
          #   commits.
          # - A beta (it pushes nothing) or a re-run: '' keeps checkout's
          #   default, the dispatch-time commit (github.sha), so re-running a
          #   finished release fails instead of publishing the next version.
          ref: ${{ github.run_attempt == '1' && inputs.bump != 'beta' && github.ref || '' }}

      # Since dispatch, only a server release may have landed: the bump and
      # CHANGELOG commits manual_release.yml pushes with github-actions[bot]
      # as committer (GitHub is the committer of every PR merged on GitHub).
      # Anything else (a second CLI release, a merged PR, a dependency
      # update, a rewound branch) would ship under npm provenance that names
      # the dispatch commit, so the run stops.
      - name: Refuse commits since dispatch other than a server release
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::error::$GITHUB_REF no longer contains $GITHUB_SHA, the commit this run was dispatched from. Nothing was pushed; dispatch again."
            exit 1
          fi
          COMMITS=$(git log --format='%cn: %s' "$GITHUB_SHA..HEAD")
          UNEXPECTED=$(printf '%s\n' "$COMMITS" | { grep -vxE 'github-actions\[bot\]: (release: v[0-9.]+|docs: update CHANGELOG\.md for v[0-9.]+)' || true; } | paste -sd, -)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::$GITHUB_REF moved from $GITHUB_SHA to $(git rev-parse HEAD) after this run was dispatched ($UNEXPECTED). Nothing was pushed; dispatch again, unless this run duplicated a CLI release that has since landed."
            exit 1
          fi

      # No registry-url / auth token: publishing uses npm Trusted Publishing
      # (OIDC) — the trusted publisher is configured on npmjs.com for this
      # repo + workflow file, and needs npm >= 11.5.1 (bundled with Node 24).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Calculate cli version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(jq -r '.version' cli/package.json)
          if [ "$CURRENT" = "null" ] || [ -z "$CURRENT" ]; then
            echo "::error::cli/package.json has no version field"
            exit 1
          fi
          if [ "$BUMP" = "beta" ]; then
            NEXT="${CURRENT}-beta.${GITHUB_RUN_NUMBER}"
          elif [ "$BUMP" = "none" ]; then
            NEXT="$CURRENT"

          # The checked-out version being tagged yet absent from npm is the
          # signature of a release that failed at npm publish. Don't bump
          # past it (silently skips a version) and don't ignore the
          # requested bump (silently overrides intent) — stop and make the
          # operator choose.
          elif git rev-parse -q --verify "refs/tags/cli-v$CURRENT" > /dev/null \
            && ! npm view "vault-cortex@$CURRENT" version > /dev/null 2>&1; then
            echo "::error::cli-v$CURRENT is tagged but not on npm — a previous release failed at publish. Dispatch again with bump \"none\" to publish $CURRENT as-is, or abandon it (delete the cli-v$CURRENT tag and revert the bump commit) and dispatch again with your intended bump."
            exit 1
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing cli $CURRENT -> $NEXT ($BUMP)"

      - name: Refuse to republish an existing version
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          if npm view "vault-cortex@$NEXT" version > /dev/null 2>&1; then
            echo "::error::vault-cortex@$NEXT is already published to npm"
            exit 1
          fi

      - run: npm ci
        # Without this, onnxruntime-node's postinstall downloads CUDA binaries on linux/x64
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: npx tsc -p cli/tsconfig.json
      - run: npx tsc -p cli/tsconfig.test.json

      - name: CLI interactive tests (node-pty)
        timeout-minutes: 20
        run: npm run test:cli-pty

      # Runs for beta too: npm publish reads the prerelease version from
      # this file, and the commit step skips beta, so that version is never
      # committed.
      - name: Bump cli/package.json
        if: inputs.bump != 'none'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          jq --arg v "$NEXT" '.version = $v' cli/package.json > cli/package.json.tmp && mv cli/package.json.tmp cli/package.json
          npx prettier --write cli/package.json

      - name: Commit, tag, and push
        if: inputs.bump != 'beta'
        env:
          NEXT: ${{ steps.next.outputs.version }}
          # The App token enters git only here, after npm ci has run.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet cli/package.json; then
            git add cli/package.json
            git commit -m "release(cli): v$NEXT"
          fi
          # Tag may already exist when dispatching again after a failed publish.
          if ! git rev-parse -q --verify "refs/tags/cli-v$NEXT" > /dev/null; then
            git tag "cli-v$NEXT"
          fi
          # --atomic updates both refs or neither: without it, a rejected
          # branch push can still deliver the tag (a tag pointing at a
          # commit that never reached main), and a failed tag push can
          # strand an untagged bump commit on main — each partial state
          # breaks the next release's version math. All-or-nothing keeps
          # the failure path a bare re-dispatch with nothing to clean up.
          if ! git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD "refs/tags/cli-v$NEXT"; then
            echo "::error::Push rejected — $GITHUB_REF gained commits during this run, or the push failed partway. Nothing was pushed; dispatch the workflow again (a re-run checks out the dispatch commit, so its push fails again if $GITHUB_REF has moved)."
            exit 1
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        env:
          TAG_FLAG: ${{ inputs.bump == 'beta' && '--tag beta' || '' }}
        run: |
          # TAG_FLAG stays unquoted: "--tag beta" must split into two
          # arguments, and an empty value must add none.
          # shellcheck disable=SC2086
          npm publish ./cli $TAG_FLAG --provenance --access public

      - name: Beta summary
        if: inputs.bump == 'beta'
        env:
          BETA_VERSION: ${{ steps.next.outputs.version }}
        run: |
          {
            echo "### CLI Beta Published"
            echo ""
            echo "**Version:** \`vault-cortex@${BETA_VERSION}\`"
            echo ""
            echo "Test with:"
            echo "\`\`\`bash"
            echo "npx vault-cortex@beta"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # --latest=false keeps the "Latest" badge on server releases. Notes
      # list only cli/ commits — server commits interleave on main, so
      # range-wide auto-notes would include unrelated work. If this step
      # fails after a successful publish, create the release manually
      # (re-running the workflow would refuse to republish the version).
      - name: Create GitHub release
        if: inputs.bump != 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          if gh release view "cli-v$NEXT" > /dev/null 2>&1; then
            echo "Release cli-v$NEXT already exists; skipping"
            exit 0
          fi
          PREV=$(git describe --tags --match "cli-v*" --abbrev=0 "cli-v$NEXT"^ 2> /dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..cli-v$NEXT"
          else
            RANGE="cli-v$NEXT"
          fi
          {
            git log "$RANGE" --pretty="- %s" -- cli/
            echo ""
            echo "Published to npm: https://www.npmjs.com/package/vault-cortex/v/$NEXT"
          } > /tmp/release-notes.md
          gh release create "cli-v$NEXT" \
            --title "cli-v$NEXT" \
            --notes-file /tmp/release-notes.md \
            --latest=false
