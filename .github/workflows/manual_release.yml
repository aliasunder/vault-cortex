name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_deploy:
        description: >-
          Skip SST deploy and Lightsail restart — the Docker image is
          still built and pushed to GHCR. Use when restarting compose
          would overwrite a manually-deployed stack.
        required: false
        type: boolean
        default: false

# Shared with cli_release.yml, which also pushes to main, and the deploy
# workflows. GitHub keeps one queued run per group, so a later release or
# deploy dispatch cancels the queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Top-level token is read-only; each job declares the writes it needs.
# A job-level permissions block replaces the whole set — every block
# must re-state contents: read for checkout. bump-and-tag needs no
# block: its commit/tag/push authenticates as the release App.
permissions:
  contents: read

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: v${{ steps.next.outputs.version }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the v* tag check and the commit check below
          # need it.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # First attempt: the branch's latest commit, so a run queued behind
          # a CLI release builds on the commit that release pushed. A re-run
          # passes '', which checkout reads as the dispatch-time commit
          # (github.sha), so re-running a finished release fails instead of
          # cutting the next version.
          ref: ${{ github.run_attempt == '1' && github.ref || '' }}

      # Since dispatch, only a CLI release may have landed: the one bump
      # commit cli_release.yml pushes with github-actions[bot] as committer
      # (GitHub is the committer of every PR merged on GitHub). Anything
      # else (a second server release, a merged PR, a rewound branch) would
      # ship under an image label and signature that name the dispatch
      # commit, so the run stops.
      - name: Refuse commits since dispatch other than a CLI release
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::error::$GITHUB_REF no longer contains $GITHUB_SHA, the commit this run was dispatched from. Nothing was pushed; dispatch again."
            exit 1
          fi
          COMMITS=$(git log --format='%cn: %s' "$GITHUB_SHA..HEAD")
          UNEXPECTED=$(printf '%s\n' "$COMMITS" | { grep -vxE 'github-actions\[bot\]: release\(cli\): v[0-9.]+' || true; } | paste -sd, -)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::$GITHUB_REF moved from $GITHUB_SHA to $(git rev-parse HEAD) after this run was dispatched ($UNEXPECTED). Nothing was pushed; dispatch again, unless this run duplicated a server release that has since landed."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Calculate next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          if [ "$CURRENT" = "null" ] || [ -z "$CURRENT" ]; then
            echo "::error::package.json has no version field; cannot compute next version"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEXT ($BUMP)"

      - name: Bump package.json, package-lock.json, and server.json
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          npm version "$NEXT" --no-git-tag-version
          jq --arg v "$NEXT" '.version = $v | .packages[0].identifier = "ghcr.io/aliasunder/vault-cortex:" + $v' server.json > server.json.tmp && mv server.json.tmp server.json
          npx prettier --write server.json

      - name: Commit, tag, and push
        env:
          NEXT: ${{ steps.next.outputs.version }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json
          git commit -m "release: v$NEXT"
          # The commit above is new, so an existing v$NEXT tag points at
          # another commit: a published release the checked-out package.json
          # predates, or a tag from a failed run.
          if git rev-parse -q --verify "refs/tags/v$NEXT" > /dev/null; then
            echo "::error::Tag v$NEXT exists but $GITHUB_REF's package.json is still at the previous version. If v$NEXT is published, stop here; otherwise the tag is stale from a failed run: delete it on origin (git push origin :refs/tags/v$NEXT) and dispatch again."
            exit 1
          fi
          git tag "v$NEXT"
          # --atomic updates both refs or neither: without it, a rejected
          # branch push can still deliver the tag (stranding it at a commit
          # that never reached main), and a failed tag push can strand an
          # untagged bump commit on main — each partial state breaks the
          # next release. All-or-nothing keeps the failure path a bare
          # re-dispatch with nothing to clean up.
          if ! git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD "refs/tags/v$NEXT"; then
            echo "::error::Push rejected — $GITHUB_REF moved during this run, or the push failed partway. Nothing was pushed; dispatch the workflow again (a re-run checks out the dispatch commit, so its push fails again if $GITHUB_REF has moved)."
            exit 1
          fi

  deploy:
    needs: bump-and-tag
    # Ceiling for the reusable workflow: AWS OIDC + GHCR push.
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.bump-and-tag.outputs.version }}
      skip_instance: ${{ inputs.skip_deploy }}
    secrets: inherit

  publish-registry:
    needs: [bump-and-tag, deploy]
    # Ceiling for the reusable workflow: MCP Registry OIDC.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ needs.bump-and-tag.outputs.version }}

  sync-dockerhub-description:
    needs: [bump-and-tag, deploy]
    permissions:
      contents: read
    uses: ./.github/workflows/dockerhub-description.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [bump-and-tag, deploy]
    runs-on: ubuntu-latest
    # gh release create uses GITHUB_TOKEN; the CHANGELOG push to main
    # authenticates as the release App, not this token. generate-notes.sh
    # reads merged PRs (labels/body) for breaking-change detection, so the
    # token also needs pull-requests: read.
    permissions:
      contents: write
      pull-requests: read
      id-token: write # cosign keyless signing via Fulcio OIDC
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-and-tag.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate release notes
        env:
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/generate-notes.sh "$TAG" > /tmp/release-notes.md

      - name: Update changelog
        env:
          VERSION: ${{ needs.bump-and-tag.outputs.version }}
        run: bash .github/scripts/update-changelog.sh "$VERSION" /tmp/release-notes.md

      - name: Commit changelog update to main
        env:
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This job checked out the release tag, but the CHANGELOG commit
          # goes on main's tip, which may have moved past the tag; the stash
          # carries the edit across.
          git stash
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git stash pop
          git add CHANGELOG.md
          # Empty when a re-run on the same UTC day finds this entry on main.
          if git diff --cached --quiet; then
            echo "No CHANGELOG.md changes to commit"
            exit 0
          fi
          git commit -m "docs: update CHANGELOG.md for $TAG"
          if ! git push origin main; then
            echo "::error::CHANGELOG push rejected — main moved after the fetch above, or the push failed. Re-run the failed jobs."
            exit 1
          fi

      # Idempotent: skip creation if the release already exists so a
      # re-run after a signing failure proceeds to the cosign steps.
      - name: Create GitHub release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
            exit 0
          fi
          for i in 1 2 3; do
            if gh release create "$TAG" \
                 --title "$TAG" \
                 --notes-file /tmp/release-notes.md; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Failed to create release after 3 attempts"
          exit 1

      - name: Install cosign
        if: ${{ needs.deploy.outputs.digest-local != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create digest file
        if: ${{ needs.deploy.outputs.digest-local != '' }}
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_USER }}/vault-cortex
          VERSION: ${{ needs.bump-and-tag.outputs.version }}
          DIGEST_LOCAL: ${{ needs.deploy.outputs.digest-local }}
          DIGEST_REMOTE: ${{ needs.deploy.outputs.digest-remote }}
        run: |
          printf '%s %s\n' "$DIGEST_LOCAL" "$IMAGE:v$VERSION" > digests.txt
          printf '%s %s\n' "$DIGEST_REMOTE" "$IMAGE:v$VERSION-remote" >> digests.txt
          cat digests.txt

      - name: Sign digest file
        if: ${{ needs.deploy.outputs.digest-local != '' }}
        run: cosign sign-blob --yes --bundle digests.txt.sigstore.json digests.txt

      - name: Upload signed digests to release
        if: ${{ needs.deploy.outputs.digest-local != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
        run: gh release upload --clobber "$TAG" digests.txt digests.txt.sigstore.json
