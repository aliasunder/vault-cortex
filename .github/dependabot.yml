version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # commander is version-synced with cli/package.json (a test enforces
      # it), and the cli supports Node >=20.12 while commander 15 requires
      # Node >=22.12. Major bumps are a deliberate cli decision.
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
      # typescript is aliased to TS 6.x (npm:typescript@6.0.3) — the JS
      # compiler API that typescript-eslint depends on. TS 7 (Go native)
      # lives under @typescript/native. A TS major here would break eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # obsidian-headless is installed from its own lockfile into the Docker
  # remote target — not in the root package.json. Dependabot needs a
  # separate entry to track version updates.
  - package-ecosystem: npm
    directory: /obsidian-headless
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the digest-pinned FROM lines in the Dockerfile current when
  # upstream node:24-slim rebuilds (e.g. Debian security releases).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A base-image major is a Node.js major — the server pins
      # engines >=24 <25 (.nvmrc, Lambda runtime nodejs24.x). Node
      # version upgrades are deliberate, not dependency churn.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
