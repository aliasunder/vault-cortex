version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /cli
    schedule:
      interval: weekly
    groups:
      # The CLI's dependencies are pinned in cli/package.json (what npx
      # installs) and in the root devDependencies (what the CLI builds and
      # tests against). This group keeps the two copies in step:
      # - A group spans every directory in the entry, so one version-update
      #   PR edits both copies and the cli dependency pinning test passes
      #   without a hand edit.
      # - Groups apply to version updates only (Dependabot's default). A
      #   security update arrives as one PR per copy, and the other copy is
      #   still edited by hand.
      # - Dependabot assigns a dependency to the first group it matches, so
      #   this group stays above production and development.
      cli:
        patterns:
          - "@clack/prompts"
          - commander
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # typescript is aliased to @typescript/typescript6 (the JS compiler
      # API that typescript-eslint depends on). TS 7 (Go native) has no JS
      # API. This ignore prevents dependabot from replacing the TS 6 compat
      # alias with a direct typescript@7.x dependency.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # rrule is pinned to the exact version the Obsidian Tasks plugin
      # ships, so recurrence computation matches the plugin by
      # construction. A bump is a deliberate parity re-verification (see
      # "Upgrading rrule" in AGENTS.md), not routine dependency churn.
      - dependency-name: rrule
      # remark-parse is pinned to 8.0.3, the version Obsidian's metadata cache
      # forked, so body tags match Obsidian by construction. 8.0.3 is the
      # last 8.x release; a bump is a parity re-verification (see "Upgrading
      # remark-parse" in AGENTS.md), not routine dependency churn.
      - dependency-name: remark-parse

  # obsidian-headless is installed from its own lockfile into the Docker
  # remote target — not in the root package.json. Dependabot needs a
  # separate entry to track version updates.
  - package-ecosystem: npm
    directory: /obsidian-headless
    schedule:
      interval: weekly

  # Batches every action bump, majors included, into one weekly PR. Groups
  # apply to version updates only, so a security update still arrives as
  # its own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Keeps the digest-pinned FROM lines in the Dockerfile current when
  # upstream node:24-slim rebuilds (e.g. Debian security releases).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A base-image major is a Node.js major — the server pins
      # engines >=24 <25 (.nvmrc, Lambda runtime nodejs24.x). Node
      # version upgrades are deliberate, not dependency churn.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
